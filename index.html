 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Sandbox with Brython</title>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
</head>
<body onload="brython()">
    <h2>Python Sandbox</h2>
    <textarea id="code" style="width:100%; height:200px;">print("Hello from Brython!")</textarea><br>
    <button onclick="runCode()">Run Code</button>
    <pre id="output"></pre>

    <script type="text/python">
from browser import document
import sys
from io import StringIO

def run_code(event):
    output = document["output"]
    output.text = ""
    try:
        old_stdout = sys.stdout
        redirected = StringIO()
        sys.stdout = redirected
        exec(document["code"].value)
        output.text = redirected.getvalue()
        sys.stdout = old_stdout
    except Exception as e:
        output.text = str(e)

document["code"].bind("input", run_code)
document["output"].text = ""
document["code"].value = 'print("Hello from Brython!")'
document["output"].text = ""
document["output"].clear = lambda: setattr(document["output"], "text", "")
document["output"].clear()
document["code"].bind("keydown", run_code)
    </script>

    <script>
        function runCode() {
            const evt = new Event("keydown");
            document.getElementById("code").dispatchEvent(evt);
        }
    </script>
</body>
</html>
